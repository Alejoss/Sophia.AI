# Rotate logs while the containers are running.
# The entrypoint scripts only rotate files before the process starts.
#
# Install on the droplet (paths match the named volumes in docker-compose.prod.yml):
#   sudo cp scripts/docker/acbc-logrotate.conf /etc/logrotate.d/acbc
#   sudo logrotate -d /etc/logrotate.d/acbc
#
# Nginx must reopen its log files after a rename (USR1).
# Do not add a Postgres entrypoint wrapper to copy its stderr. That wrapper
# made acbc_postgres_prod fail its healthcheck. See
# docs/operations/postgres-container-unhealthy.md.

/var/lib/docker/volumes/acbc_prod_nginx_logs/_data/*.log
/var/lib/docker/volumes/acbc_prod_frontend_logs/_data/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    sharedscripts
    postrotate
        if [ -x /usr/bin/docker ]; then
            /usr/bin/docker kill -s USR1 acbc_nginx_prod >/dev/null 2>&1 || true
            /usr/bin/docker kill -s USR1 acbc_frontend_prod >/dev/null 2>&1 || true
        fi
    endscript
}

