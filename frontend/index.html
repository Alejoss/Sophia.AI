<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Payphone Botón de pago validates the Referer against the registered WEB domain. -->
    <meta name="referrer" content="origin" />
    <title>Academia Blockchain</title>
    <meta
      name="description"
      content="Biblioteca, temas y aprendizaje sobre Bitcoin, blockchain y cultura digital."
    />
    <!-- Default site-level Open Graph (SPA shell). Per-content previews are
         injected server-side for social crawlers — see nginx bot routing +
         /api/content/social-preview/. -->
    <meta property="og:site_name" content="Academia Blockchain" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Academia Blockchain" />
    <meta
      property="og:description"
      content="Biblioteca, temas y aprendizaje sobre Bitcoin, blockchain y cultura digital."
    />
    <meta property="og:image" content="/images/home_hero_brand_v2.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Academia Blockchain" />
    <meta
      name="twitter:description"
      content="Biblioteca, temas y aprendizaje sobre Bitcoin, blockchain y cultura digital."
    />
    <meta name="twitter:image" content="/images/home_hero_brand_v2.png" />
    <!-- Keep URLs in sync with frontend/src/images/homeHeroAssets.js -->
    <script>
      (function () {
        var authed = false;
        try {
          authed =
            localStorage.getItem('is_authenticated') === 'true' &&
            !!localStorage.getItem('access_token') &&
            !!localStorage.getItem('user');
        } catch (e) {}
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.type = 'image/webp';
        link.setAttribute('imagesizes', '100vw');
        if (authed) {
          link.href = '/images/sobre_nosotros_hero-960.webp';
          link.setAttribute(
            'imagesrcset',
            '/images/sobre_nosotros_hero-640.webp 640w, /images/sobre_nosotros_hero-960.webp 960w, /images/sobre_nosotros_hero-1120.webp 1120w'
          );
        } else {
          link.href = '/images/home_hero-960.webp';
          link.setAttribute(
            'imagesrcset',
            '/images/home_hero-640.webp 640w, /images/home_hero-960.webp 960w, /images/home_hero-1120.webp 1120w'
          );
        }
        document.head.appendChild(link);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
