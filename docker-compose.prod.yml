services:
  nginx:
    image: ${GHCR_IMAGE_PREFIX:?Set GHCR_IMAGE_PREFIX}-nginx:${IMAGE_TAG:-main}
    pull_policy: always
    container_name: acbc_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINX_CONF:-./nginx/nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/persisted-logs.conf:/etc/nginx/conf.d/00-persisted-logs.conf:ro
      - ./nginx/acbc-nginx-entrypoint.sh:/opt/acbc-nginx-entrypoint.sh:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx/persisted
    # command must stay. Overriding entrypoint clears the image CMD; without
    # "daemon off" nginx backgrounds itself and the container exits 0.
    entrypoint: ["/bin/sh", "/opt/acbc-nginx-entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    depends_on:
      - backend
      - frontend
    networks:
      - app_network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  backend:
    image: ${GHCR_IMAGE_PREFIX:?Set GHCR_IMAGE_PREFIX}-backend:${IMAGE_TAG:-main}
    pull_policy: always
    container_name: acbc_backend_prod
    # Code stays in the image. backend_logs keeps Django and Gunicorn files
    # after `up --force-recreate` (docker compose logs does not).
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - backend_logs:/app/logs
    env_file:
      - ./acbc_app/.env
    environment:
      - ENVIRONMENT=PRODUCTION
      - LOGS_DIR=/app/logs
    # Don't expose port directly - accessed via nginx
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ${GHCR_IMAGE_PREFIX:?Set GHCR_IMAGE_PREFIX}-frontend:${IMAGE_TAG:-main}
    pull_policy: always
    container_name: acbc_frontend_prod
    # Static files stay in the image. This volume only keeps nginx access logs.
    volumes:
      - frontend_logs:/var/log/nginx/persisted
      - ./nginx/persisted-logs.conf:/etc/nginx/conf.d/00-persisted-logs.conf:ro
      - ./nginx/acbc-nginx-entrypoint.sh:/opt/acbc-nginx-entrypoint.sh:ro
    # Same as edge nginx: keep the foreground command when overriding entrypoint.
    entrypoint: ["/bin/sh", "/opt/acbc-nginx-entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    # Don't expose port directly - accessed via nginx
    expose:
      - "80"
    networks:
      - app_network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      # Use 127.0.0.1 to avoid localhost IPv6 resolution issues in alpine/busybox wget.
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:15
    container_name: acbc_postgres_prod
    # Credentials come from acbc_app/.env only — avoid ${DB_PASSWORD} interpolation
    # here so Docker Compose does not treat $ in passwords as variable references.
    env_file:
      - ./acbc_app/.env
    environment:
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C.UTF-8
    # Do not replace the image entrypoint. A wrapper that teed stderr made
    # acbc_postgres_prod fail its healthcheck (Cloudflare 521). Postgres logs
    # for the running container are `docker compose logs postgres`.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" || pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  # Explicit names survive a checkout in a different directory. `down -v` deletes them.
  backend_logs:
    name: acbc_prod_backend_logs
  nginx_logs:
    name: acbc_prod_nginx_logs
  frontend_logs:
    name: acbc_prod_frontend_logs
  # certbot dirs (./certbot/www, ./certbot/certs) are bind-mounted; created by setup-ssl.sh
