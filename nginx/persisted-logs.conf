# Second copy of nginx logs on the nginx_logs / frontend_logs volume.
# The image already writes /var/log/nginx/access.log and error.log, which are
# symlinks to stdout/stderr and disappear when the container is recreated.
# The "main" format is defined by the official nginx image before conf.d is included.
access_log /var/log/nginx/persisted/access.log main;
error_log /var/log/nginx/persisted/error.log notice;
