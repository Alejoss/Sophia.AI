# Upstream backend API (using docker-compose service name)
upstream backend {
    server backend:8000;
}

# Upstream frontend (using docker-compose service name)
upstream frontend {
    server frontend:80;
}

# Social unfurlers do not execute SPA JS; route them to Django OG HTML.
map $http_user_agent $is_social_crawler {
    default 0;
    ~*(?i)(TelegramBot|facebookexternalhit|Facebot|Twitterbot|LinkedInBot|Slackbot|Discordbot|WhatsApp|SkypeUriPreview|Pinterest|redditbot|Embedly|Quora\sLink\sPreview|Showyoubot|outbrain|vkShare|W3C_Validator|Googlebot|bingbot|Applebot|DuckDuckBot|Baiduspider|YandexBot|Slurp|ia_archiver) 1;
}

# HTTP server - works by IP (e.g. http://159.65.69.165) without SSL
# For HTTPS, run setup-ssl.sh and use nginx-ssl.conf or add ssl_certificate directives
server {
    listen 80;
    server_name _;

    # Allow large uploads (e.g. videos, documentaries) for /api/content/upload-content/
    client_max_body_size 5120M;

    # Let's Encrypt challenge (for when you run certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Backend health: proxy to Django /health/ (JSON)
    location /health/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Lightweight nginx-only health (no trailing slash)
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Backend API (long timeouts for large file uploads)
    location /api/ {
        client_max_body_size 5120M;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Django admin
    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public";
    }


    # Knowledge paths (React route: /knowledge_path/:id)
    location ~ ^/knowledge_path/(?<path_id>[0-9]+)(?:/|$) {
        if ($is_social_crawler) {
            rewrite ^ /api/knowledge_paths/social-preview/$path_id/ last;
        }
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Events (React route: /events/:id — numeric id only)
    location ~ ^/events/(?<event_id>[0-9]+)(?:/|$) {
        if ($is_social_crawler) {
            rewrite ^ /api/events/social-preview/$event_id/ last;
        }
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Topic pages before /content/<id> so "topics" is not treated as an id
    location ~ ^/content/topics/(?<topic_id>[0-9]+)(?:/|$) {
        if ($is_social_crawler) {
            rewrite ^ /api/content/topics/social-preview/$topic_id/ last;
        }
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Content detail pages: social crawlers get OG HTML from Django

    # Content inside a topic: preserve topic context for OG title/profile
    location ~ ^/content/(?<content_id>[0-9]+)/topic/(?<topic_id>[0-9]+)(?:/|$) {
        if ($is_social_crawler) {
            rewrite ^ /api/content/social-preview/$content_id/?context=topic&id=$topic_id last;
        }
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~ ^/content/(?<content_id>[0-9]+)(?:/|$) {
        if ($is_social_crawler) {
            rewrite ^ /api/content/social-preview/$content_id/$is_args$args last;
        }
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Frontend - React app (must be last)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
